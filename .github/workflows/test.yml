name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The plugin ships a POSIX installer and a PowerShell one, pins CRLF for
    # .ps1 and LF for .sh, and does path arithmetic against ~/.claude/projects.
    # None of that had ever run anywhere but the author's Windows machine.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18.13', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node version
        run: node -v

      - name: Test
        run: npm test

      - name: Report renders against the committed fixture
        shell: bash
        env:
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: '1000000'
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: '700000'
        run: |
          node plugins/context-doctor/scripts/context-report.js \
            --transcript plugins/context-doctor/test/fixtures/showcase.jsonl
          node plugins/context-doctor/scripts/context-report.js \
            --transcript plugins/context-doctor/test/fixtures/showcase.jsonl \
            --format json > /dev/null

      - name: The fixture is reproducible from its generator
        shell: bash
        run: |
          node plugins/context-doctor/test/fixtures/make-fixture.js
          git diff --exit-code -- plugins/context-doctor/test/fixtures/showcase.jsonl \
            || { echo "showcase.jsonl is out of date; re-run make-fixture.js and commit"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh is valid POSIX sh
        run: sh -n install.sh

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --shell=sh install.sh

      - name: Line endings are as .gitattributes promises
        run: |
          # A CRLF install.sh fails with "bad interpreter: /usr/bin/env sh^M"
          # when piped to a shell, which is exactly how the README serves it.
          if grep -qU $'\r' install.sh; then echo "install.sh must be LF"; exit 1; fi
          if ! grep -qU $'\r' install.ps1; then echo "install.ps1 must be CRLF"; exit 1; fi

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/context-doctor/.claude-plugin/plugin.json \
                   plugins/context-doctor/hooks/hooks.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
            echo "ok $f"
          done

      - name: Plugin and package versions agree
        run: |
          node -e "
            const a = require('./package.json').version;
            const b = require('./plugins/context-doctor/.claude-plugin/plugin.json').version;
            if (a !== b) { console.error('version drift: package.json ' + a + ' vs plugin.json ' + b); process.exit(1); }
            console.log('ok version ' + a);
          "

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # [ref] cannot be applied to a variable that does not exist yet, and
          # ParseFile needs a string path rather than a PathInfo object.
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path .\install.ps1).Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host 'ok install.ps1 parses'

  version:
    # A change under plugins/ only reaches an installed copy if the version in
    # plugin.json moves. Claude Code caches plugins per version at
    # ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/ and
    # `claude plugin update` compares version strings, so a push that changes the
    # plugin without bumping it leaves everyone on the old code while the update
    # command reports "already at the latest version". Nothing else notices.
    #
    # The invariant: if the current version is already tagged, the shipped tree
    # must be identical to that tag. Before the first tag exists there is nothing
    # to compare against, so this job passes and stays out of the way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, and enough history to diff against them

      - name: A released version must not have moved on underneath its tag
        shell: bash
        run: |
          version=$(node -p "require('./plugins/context-doctor/.claude-plugin/plugin.json').version")
          tag="context-doctor--v$version"
          echo "version in plugin.json: $version"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag does not exist, so $version has not been released - nothing to guard."
            exit 0
          fi

          if git diff --quiet "$tag" HEAD -- plugins/; then
            echo "plugins/ is identical to $tag - ok."
            exit 0
          fi

          echo
          echo "plugins/ has changed since $tag, but the version is still $version."
          echo "Installed copies are cached per version, so this change would reach nobody:"
          echo "  claude plugin update would report \"already at the latest version ($version)\"."
          echo
          echo "Bump version in plugins/context-doctor/.claude-plugin/plugin.json"
          echo "and package.json (the lint job checks they agree), then tag the release."
          echo
          git diff --stat "$tag" HEAD -- plugins/
          exit 1
